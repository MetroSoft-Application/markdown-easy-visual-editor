name: CLI extraction checks

on:
  push:
    paths:
      - 'cli/**'
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/cli-extraction.yml'
  pull_request:
    paths:
      - 'cli/**'
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/cli-extraction.yml'

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run check
      - run: npm test
  conversion:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: CLI type checks
        run: npm run check:cli
      - name: Build the original assets and CLI
        run: npm run build:cli
      - name: Install Chromium for parity smoke tests
        run: npx playwright-core install --with-deps chromium
      - name: Convert Markdown, linked HTML and PDF
        run: |
          BROWSER=$(find "$HOME/.cache/ms-playwright" -type f -name chrome | head -n 1)
          if [ -z "$BROWSER" ]; then echo 'Chromium binary not found' >&2; exit 1; fi
          MVE_CLI_TEST_BROWSER="$BROWSER" node --test cli/test/smoke.mjs
